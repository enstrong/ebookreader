name: ebookreader-demo
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ebookreader_demo
      POSTGRES_USER: ebookreader
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a database password}
    volumes: [database:/var/lib/postgresql/data]
    mem_limit: 1g
    logging: *logging
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ebookreader -d ebookreader_demo']
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    image: eclipse-temurin:17-jre-jammy
    restart: unless-stopped
    working_dir: /app
    user: '1000:1000'
    command: [java, '-Xmx1200m', '-jar', /app/app.jar]
    environment:
      SPRING_PROFILES_ACTIVE: demo
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ebookreader_demo
      SPRING_DATASOURCE_USERNAME: ebookreader
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set a database password}
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT signing secret}
      LOOKUP_TRANSLATE_BASE_URL: http://libretranslate:5000
      RECOMMENDATIONS_HYBRID_SERVICE_URL: http://recommender:8001
      RECOMMENDATIONS_WORK_MAP_PATH: /app/model/goodreads_work_map.csv
      EBOOKREADER_DEMO_CATALOG_PATH: /app/catalog.json
    volumes:
      - ../../backend/target/ebookreader-backend-1.0.0.jar:/app/app.jar:ro
      - ../../backend/assets:/app/assets:ro
      - ../../build/demo/catalog.json:/app/catalog.json:ro
      - ../../data/recommendations/hybrid/goodreads_work_map.csv:/app/model/goodreads_work_map.csv:ro
    mem_limit: 2g
    pids_limit: 256
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    logging: *logging
    depends_on:
      db: {condition: service_healthy}
      recommender: {condition: service_healthy}
  recommender:
    build:
      context: ../..
      dockerfile: scripts/recommendations/Dockerfile.hybrid
    restart: unless-stopped
    environment:
      RECOMMENDATION_MODEL_DIR: /app/model
      RECOMMENDATION_METADATA_CSV: /app/metadata/book_metadata_workcanon_20k_i5.csv
      RECOMMENDATION_WORK_MAP_CSV: /app/metadata/goodreads_work_map.csv
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    volumes:
      - ../../data/recommendations/experiments/als_reads_workcanon_20k_f256_i2_lam1p0_validation_split:/app/model:ro
      - ../../data/recommendations/hybrid:/app/metadata:ro
    mem_limit: 3g
    pids_limit: 128
    logging: *logging
    healthcheck:
      test: [CMD, python, '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health',timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
  libretranslate:
    image: libretranslate/libretranslate:latest
    restart: unless-stopped
    environment:
      LT_LOAD_ONLY: en,ru
      LT_DISABLE_WEB_UI: 'true'
      LT_CHAR_LIMIT: '5000'
      LT_THREADS: '2'
      OMP_NUM_THREADS: '1'
    volumes: [translation:/home/libretranslate/.local]
    mem_limit: 3g
    pids_limit: 128
    logging: *logging
  web:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports: ['127.0.0.1:18888:80']
    volumes:
      - ../../build/web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 128m
    logging: *logging
    depends_on: [backend]
  https:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      DEMO_HOST: ${DEMO_HOST:?Set the public hostname}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy_config:/config
    mem_limit: 128m
    logging: *logging
    depends_on: [web]
volumes:
  database:
  translation:
  certificates:
  caddy_config:
