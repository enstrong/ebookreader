limit_req_zone $http_x_real_ip zone=sessions:1m rate=2r/m;
limit_req_zone $http_x_real_ip zone=api:10m rate=12r/s;
proxy_cache_path /var/cache/nginx/covers levels=1:2 keys_zone=covers:4m max_size=256m inactive=30d;
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 11m;
    add_header X-Content-Type-Options nosniff always;
    location = /api/demo/session {
        limit_req zone=sessions burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
    location /api/ {
        limit_req zone=api burst=30 nodelay;
        limit_req_status 429;
        proxy_read_timeout 90s;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
    location /covers/ { proxy_pass http://backend:8080; }
    # Fixed upstream and numeric cover paths: this cannot fetch arbitrary URLs.
    location ~ ^/cover-images/(books/[0-9]+[sml]/[0-9]+\.jpg)$ {
        rewrite ^/cover-images/(.*)$ /$1 break;
        proxy_pass https://images.gr-assets.com;
        proxy_set_header Host images.gr-assets.com;
        proxy_set_header Authorization '';
        proxy_set_header Cookie '';
        proxy_set_header Referer '';
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_cache covers;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 10m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        add_header X-Cover-Cache $upstream_cache_status;
    }
    location /cover-images/ { return 404; }
    location /assets/audio/ { proxy_pass http://backend:8080; }
    location ~ (^|/)\. { deny all; }
    location = /assets/.env { return 404; }
    location = /flutter_service_worker.js { add_header Cache-Control 'no-store'; }
    location / {
        add_header Cache-Control 'no-cache';
        try_files $uri $uri/ /index.html;
    }
}
